name: Component regression
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      warm_native_cache:
        description: Warm Native toolchains on main only (leave version empty)
        type: boolean
        default: false
      archive_prebuilt:
        description: Build a frozen candidate Maven archive on macOS (requires version)
        type: boolean
        default: false
      version:
        description: Immutable release tag to verify (empty runs source regression)
        type: string
        required: false
permissions:
  contents: read
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  # 此版 Native 下载器使用 URLConnection 默认超时；阻塞读取必须退出，才能进入其已有续传重试。
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - id: scope
        run: python3 scripts/ci-changes.py
      - run: |
          mkdir -p ci-diagnostics
          printf 'event=%s\nsource=%s\n' "$GITHUB_EVENT_NAME" "${{ steps.scope.outputs.source }}" > ci-diagnostics/scope.txt
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  archive-prebuilt:
    if: github.event_name == 'workflow_dispatch' && inputs.archive_prebuilt && inputs.version != ''
    needs: changes
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.konan
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
      - name: Build and check complete Maven archive
        timeout-minutes: 50
        run: |
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/archive.log -- bash scripts/archive-prebuilt.sh
          python3 - <<'PROVENANCE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'ls-files', 'diagnostics-core', 'diagnostics-dingtalk', 'diagnostics-ktor', 'diagnostics-okhttp', 'diagnostics-bugly', 'diagnostics-umeng', 'diagnostics-kuikly', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle', 'scripts/archive-prebuilt.sh', 'jitpack-metadata.py', 'verification/check-maven.py']).decode().splitlines()
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sorted(files)}
          Path('build/prebuilt/provenance.json').write_text(json.dumps({'version': os.environ['VERSION'], 'sourceCommit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'], 'sourceFiles': hashes, 'archiveSha256': hashlib.sha256(Path('build/prebuilt/diagnostics-maven.tar.gz').read_bytes()).hexdigest()}, indent=2) + '\n')
          PROVENANCE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-prebuilt-${{ inputs.version }}
          path: build/prebuilt/
          if-no-files-found: error
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  verify-public:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/ci-diagnostics
      VERIFY_OHOS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Check exact frozen archive and public publications once
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
        timeout-minutes: 30
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/verify-public.log -- bash scripts/ci-release.sh
      - if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)) }}
        run: echo 'Public artifact validation runs for Release or an explicit version dispatch.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  contracts:
    if: always()
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful scope detection
        run: test "${{ needs.changes.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - timeout-minutes: 8
        if: needs.changes.outputs.source == 'true'
        run: |
          python3 scripts/test-check-maven.py
          python3 scripts/test-jitpack-metadata.py
          python3 scripts/test-check-public-maven.py
          bash -n scripts/archive-prebuilt.sh scripts/ci-release.sh jitpack-install.sh
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Check fork host trust boundaries
        if: needs.changes.outputs.source == 'true'
        run: python3 verification/ci/test_fork_host.py
      - name: Check optional OHOS HAR archive contract
        if: needs.changes.outputs.source == 'true'
        run: python3 verification/test_ohos_sdk_archive.py
      - name: Check R8 consumer SPI verifier
        if: needs.changes.outputs.source == 'true'
        run: python3 verification-consumer/verify-r8.py --self-test
      - name: Check source cache and test execution policy
        if: needs.changes.outputs.source == 'true'
        run: python3 verification/ci/test_cache_contract.py
      - name: Check CI shell syntax
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ci-python-cache" python3 -m py_compile scripts/ci-changes.py scripts/ci-run.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  android:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GYC_CI_BUILD_CACHE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: needs.changes.outputs.source == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: needs.changes.outputs.source == 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
        timeout-minutes: 35
        if: needs.changes.outputs.source == 'true'
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: needs.changes.outputs.source == 'true'
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :diagnostics-core:jvmTest :diagnostics-core:testDebugUnitTest :diagnostics-dingtalk:jvmTest :diagnostics-dingtalk:testDebugUnitTest :diagnostics-ktor:jvmTest :diagnostics-ktor:testDebugUnitTest :diagnostics-okhttp:jvmTest :diagnostics-okhttp:compileDebugKotlinAndroid :diagnostics-bugly:testDebugUnitTest :diagnostics-umeng:testDebugUnitTest --no-daemon --max-workers=1
        timeout-minutes: 35
        if: needs.changes.outputs.source == 'true'
      - run: python3 scripts/assert-test-results.py diagnostics-core/build/test-results/jvmTest diagnostics-dingtalk/build/test-results/jvmTest diagnostics-ktor/build/test-results/jvmTest diagnostics-okhttp/build/test-results/jvmTest diagnostics-core/build/test-results/testDebugUnitTest diagnostics-dingtalk/build/test-results/testDebugUnitTest diagnostics-ktor/build/test-results/testDebugUnitTest diagnostics-bugly/build/test-results/testDebugUnitTest diagnostics-umeng/build/test-results/testDebugUnitTest
        timeout-minutes: 35
        if: needs.changes.outputs.source == 'true'
      - name: Resolve source metadata with bounded connection recovery
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 8
        run: |
          SOURCE_R8_VERSION="source-r8-${GITHUB_SHA}"
          # Gradle 默认每个文件内重试 3 次；此准备任务由下方严格外层恢复，避免先耗尽 8 分钟总界。
          for attempt in 1 2 3; do
            log="ci-diagnostics/source-r8-metadata-$attempt.log"
            # 仓库 HTTP 使用 Apache；URLConnection 的 sun.net.client 参数不覆盖此连接限时。
            if VERSION="$SOURCE_R8_VERSION" python3 scripts/ci-run.py --no-progress-seconds 300 --log "$log" -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :diagnostics-core:transformCommonMainDependenciesMetadata -Dorg.gradle.internal.repository.max.tentatives=1 -Dorg.gradle.internal.http.connectionTimeout=10000 -Dorg.gradle.internal.http.socketTimeout=60000 --no-daemon --max-workers=1; then
              break
            else
              resolve_status=$?
            fi
            # 只恢复这个下载任务的精确 TCP 失败；编译、TLS、HTTP 和混合错误立即保留失败。
            if ! url="$(python3 "$GITHUB_WORKSPACE/scripts/ci-metadata-retry.py" "$log")"; then
              exit "$resolve_status"
            fi
            if [[ -n "$url" ]]; then
              # 同 runner / 精确公开 URL 的探测只留诊断；不能替代 Gradle 成功。
              probe="ci-diagnostics/source-r8-network-$attempt.log"
              curl --disable --head --fail --silent --show-error --proto '=https' --ipv4 --noproxy maven.eazytec-cloud.com --connect-timeout 5 --max-time 15 --output /dev/null --write-out 'http=%{http_code} remote_ip=%{remote_ip} connect_seconds=%{time_connect}\n' "$url" > "$probe" 2>&1 || true
              cat "$probe"
            fi
            if [[ "$attempt" == 3 ]]; then exit "$resolve_status"; fi
            echo "Retrying only metadata TCP connection failure ($attempt/3); first receipts preserved"
            sleep "$((attempt * 2))"
          done
      - name: Verify Android R8 from source staging publications
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 15
        run: |
          publications=()
          for module in core bugly umeng; do
            publications+=(":diagnostics-$module:publishKotlinMultiplatformPublicationToStagingRepository" ":diagnostics-$module:publishAndroidReleasePublicationToStagingRepository")
          done
          # 每个受测 SHA 使用独立坐标，避免旧 staging 缓存；三组消费复用已解析的不可变插件依赖。
          SOURCE_R8_VERSION="source-r8-${GITHUB_SHA}"
          VERSION="$SOURCE_R8_VERSION" python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/source-r8-publish.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info "${publications[@]}" --no-daemon --max-workers=1
          for provider in none bugly umeng; do
            python3 scripts/ci-run.py --no-progress-seconds 300 --log "ci-diagnostics/source-r8-$provider.log" -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification-consumer :r8-app:minifyReleaseWithR8 :r8-app:verifyR8Release -PdiagnosticsVersion="$SOURCE_R8_VERSION" -PdiagnosticsMavenRepo="$PWD/build/maven" -PdiagnosticsProviders=true -PdiagnosticsProvider="$provider" --no-daemon --max-workers=1
          done
      - name: Verify optional OHOS native and Renderer contracts
        if: needs.changes.outputs.source == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/diagnostics-typescript" --no-save --ignore-scripts typescript@5.8.3
          export TYPESCRIPT_PATH="$RUNNER_TEMP/diagnostics-typescript/node_modules/typescript/lib/typescript.js"
          node --test verification/ohos-sdk.cjs
          python3 verification/test_ohos_diagnostics_bridge.py --resolve-dependencies
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  native:
    needs: changes
    runs-on: ${{ ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      GYC_CI_BUILD_CACHE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Identify Native toolchain and Xcode
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: needs.changes.outputs.source == 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
      - timeout-minutes: 45
        if: needs.changes.outputs.source == 'true'
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then simulator=iosSimulatorArm64Test; else simulator=iosX64Test; fi
          # 复用同一 Gradle JVM 的成功 DNS 缓存；编译后的新进程曾在测试启动前解析失败。
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :diagnostics-core:compileKotlinIosArm64 :diagnostics-dingtalk:compileKotlinIosArm64 :diagnostics-ktor:compileKotlinIosArm64 :diagnostics-core:compileKotlinOhosArm64 :diagnostics-dingtalk:compileKotlinOhosArm64 :diagnostics-ktor:compileKotlinOhosArm64 :diagnostics-kuikly:compileKotlinOhosArm64 ":diagnostics-core:$simulator" ":diagnostics-dingtalk:$simulator" ":diagnostics-ktor:$simulator" --no-daemon --max-workers=1
          python3 scripts/assert-test-results.py "diagnostics-core/build/test-results/$simulator" "diagnostics-dingtalk/build/test-results/$simulator" "diagnostics-ktor/build/test-results/$simulator"
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native.log -- xcrun --sdk iphonesimulator swiftc -typecheck -target "$(uname -m)-apple-ios14.0-simulator" -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" ios-support/*.swift
        timeout-minutes: 10
        if: needs.changes.outputs.source == 'true'
      - name: Verify independent native SDK Pods and adapter behavior
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 25
        run: |
          CI_POD_PREFIX="$(brew --prefix)"
          GEM_HOME="$CI_POD_PREFIX/opt/cocoapods/libexec" "$CI_POD_PREFIX/opt/ruby/bin/ruby" scripts/verify-tagged-ios-sdk.rb --check-only
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/ios-sdk.log -- bash scripts/test-ios-sdk.sh
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Warm trusted main Native cache
        if: (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main') && steps.konan.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-warmup.log -- python3 scripts/ci-native-cache.py
      - name: Cache only successful Native downloads
        if: success() && ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-android:
    if: always()
    needs: [changes, verify-public]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Require successful scope and public verification
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
        with:
          distribution: temurin
          java-version: ${{ contains(fromJSON('["0.1.0","0.2.0-rc.1","0.2.0-rc.2","0.2.0-rc.3","0.2.0-rc.4","0.2.0-rc.5"]'), env.VERSION) && '21' || '17' }}
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
        timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
      - timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
        run: |
          network=true
          case "$VERSION" in 0.1.0|0.2.0-rc.[1-5]) network=false ;; esac
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification-consumer jvmTest testDebugUnitTest compileDebugKotlinAndroid -PdiagnosticsVersion="$VERSION" -PdiagnosticsClosure=true -PdiagnosticsNetwork="$network" -PdiagnosticsProviders=true --refresh-dependencies --no-daemon --max-workers=1
          case "$VERSION" in
            0.1.0|0.2.0-rc.[1-9]|0.2.0-rc.1[0-2]) ;;
            *)
              for provider in none bugly umeng; do
                tasks=(:r8-app:minifyReleaseWithR8 :r8-app:verifyR8Release)
                if [[ "$provider" != none ]]; then tasks+=(testDebugUnitTest compileDebugKotlinAndroid); fi
                python3 scripts/ci-run.py --no-progress-seconds 300 --log "ci-diagnostics/release-android-$provider.log" -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification-consumer "${tasks[@]}" -PdiagnosticsVersion="$VERSION" -PdiagnosticsClosure=true -PdiagnosticsNetwork="$network" -PdiagnosticsProviders=true -PdiagnosticsProvider="$provider" --no-daemon --max-workers=1
              done
              ;;
          esac
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)) }}
        run: echo 'No build is required for this event and scope.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-native:
    if: always()
    needs: [changes, verify-public]
    runs-on: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Require successful scope and public verification
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Identify Native toolchain and Xcode
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
      - timeout-minutes: 45
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
        run: |
          network=true
          case "$VERSION" in 0.1.0|0.2.0-rc.[1-5]) network=false ;; esac
          if [[ "$(uname -m)" == arm64 ]]; then simulator=linkDebugFrameworkIosSimulatorArm64; simulator_test=iosSimulatorArm64Test; else simulator=linkDebugFrameworkIosX64; simulator_test=iosX64Test; fi
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification-consumer compileKotlinIosArm64 "$simulator" "$simulator_test" linkDebugSharedOhosArm64 -PdiagnosticsVersion="$VERSION" -PdiagnosticsClosure=true -PdiagnosticsNetwork="$network" -PdiagnosticsProviders=true --refresh-dependencies --no-daemon --max-workers=1
      - name: Verify exact tagged iOS native consumers
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)
        timeout-minutes: 25
        run: |
          # 冻结旧版本保留原 Maven/Native consumer，不追加其尚未提供的四 Pod 验证。
          case "$VERSION" in
            0.1.0|0.2.0-rc.[1-9]|0.2.0-rc.1[0-8]) echo "Exact tagged iOS native consumers apply from rc.19; skipped for $VERSION"; exit 0 ;;
          esac
          CI_POD_PREFIX="$(brew --prefix)"
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/tagged-ios.log -- env "GEM_HOME=$CI_POD_PREFIX/opt/cocoapods/libexec" "$CI_POD_PREFIX/opt/ruby/bin/ruby" scripts/verify-tagged-ios-sdk.rb
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)) }}
        run: echo 'No build is required for this event and scope.'
      - name: Cache only successful Native downloads
        if: success() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !inputs.archive_prebuilt)) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
