// GitHub-hosted runner 访问公开仓库；避免国内镜像 502 阻断 Gradle 的官方仓库解析。
gradle.settingsEvaluated { settings ->
    [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repositories ->
        repositories.removeAll { it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && it.url.host == 'maven.aliyun.com' }
    }
}
